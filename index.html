<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карта України</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #111; color: #eee; }
    #map { height: 100vh; width: 100%; background: #111; }

    .panel {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 1000;
      background: rgba(20, 22, 28, 0.95);
      padding: 16px;
      border-radius: 12px;
      width: 260px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      border: 1px solid #333;
    }

    .panel h3 {
      font-size: 15px;
      margin-bottom: 12px;
    }

    button {
      display: block;
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      color: white;
    }

    .btn1 { background: #2563eb; }
    .btn2 { background: #16a34a; }
    .btn3 { background: #dc2626; }

    #status {
      margin-top: 12px;
      font-size: 12px;
      color: #aaa;
      line-height: 1.4;
    }
  </style>
</head>
<body>

<div id="map"></div>

<div class="panel">
  <h3>Карта війни</h3>

  <button class="btn1" onclick="setSatellite()">Супутник</button>
  <button class="btn1" onclick="setStreets()">Вулиці</button>
  <button class="btn1" onclick="setDark()">Темна</button>

  <button class="btn2" onclick="downloadGeoJSON()">Завантажити GeoJSON</button>
  <button class="btn3" onclick="location.reload()">Оновити</button>

  <div id="status">Завантаження...</div>
</div>

<script>
  // Створюємо карту
  const map = L.map('map', {
    center: [48.4, 37.5],
    zoom: 6,
    zoomControl: false
  });

  L.control.zoom({ position: 'topright' }).addTo(map);

  // Шари
  const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 18,
    attribution: 'Esri'
  });

  const streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: 'OSM'
  });

  const dark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 18,
    attribution: 'Carto'
  });

  let currentLayer = satellite;
  satellite.addTo(map);

  function setSatellite() {
    map.removeLayer(currentLayer);
    currentLayer = satellite;
    satellite.addTo(map);
  }

  function setStreets() {
    map.removeLayer(currentLayer);
    currentLayer = streets;
    streets.addTo(map);
  }

  function setDark() {
    map.removeLayer(currentLayer);
    currentLayer = dark;
    dark.addTo(map);
  }

  let occupiedLayer = null;

  // Завантаження даних
  const url = 'https://raw.githubusercontent.com/cyterat/deepstate-map-data/main/data/deepstatemap_data_20261004.geojson';

  fetch(url)
    .then(response => {
      if (!response.ok) {
        throw new Error('HTTP помилка: ' + response.status);
      }
      return response.json();
    })
    .then(data => {
      occupiedLayer = L.geoJSON(data, {
        style: {
          color: '#ef4444',
          weight: 2,
          fillColor: '#ef4444',
          fillOpacity: 0.4
        }
      }).addTo(map);

      document.getElementById('status').innerHTML = 'Дані завантажено успішно<br>4 жовтня 2026';
    })
    .catch(error => {
      console.error(error);
      document.getElementById('status').innerHTML = 
        '<span style="color:#f87171">Помилка завантаження даних</span><br>' + 
        error.message + 
        '<br><br>Відкрий консоль (F12) для деталей';
    });

  function downloadGeoJSON() {
    if (!occupiedLayer) {
      alert('Дані ще не завантажилися');
      return;
    }

    const geojson = occupiedLayer.toGeoJSON();
    const blob = new Blob([JSON.stringify(geojson, null, 2)], {type: 'application/json'});
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'ukraine_occupied.geojson';
    link.click();
  }
</script>
</body>
</html>
