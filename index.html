<!DOCTYPE html>
<html>
<head>
  <title>Карта війни в Україні</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; }
    #map { height: 100vh; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([48.5, 37.5], 6);

    // Підложка (можна змінити)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // Завантаження актуальних даних DeepState
    fetch('https://raw.githubusercontent.com/cyterat/deepstate-map-data/main/data/deepstatemap_data_20260116.geojson') // заміни на свіжий файл
      .then(response => response.json())
      .then(data => {
        L.geoJSON(data, {
          style: {
            color: '#c0392b',
            weight: 1,
            fillColor: '#e74c3c',
            fillOpacity: 0.45
          }
        }).addTo(map);
      });
  </script>
</body>
</html>
