<!DOCTYPE html>
<html>
<head>
  <title>Карта України - редагування контуру</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet-Geoman -->
  <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.18.3/dist/leaflet-geoman.css" />
  <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.18.3/dist/leaflet-geoman.min.js"></script>

  <style>
    body { margin: 0; padding: 0; }
    #map { height: 100vh; width: 100%; }
    .info {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;
      background: white;
      padding: 12px 16px;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
      font-family: sans-serif;
      font-size: 14px;
    }
    .info button {
      margin-top: 8px;
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      background: #27ae60;
      color: white;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>

<div id="map"></div>

<div class="info">
  <b>Редагування контуру</b><br>
  1. Натисни кнопку Edit на панелі зліва<br>
  2. Клікни по червоному контуру<br>
  3. Тягни вершини
  <button onclick="downloadGeoJSON()">Завантажити GeoJSON</button>
</div>

<script>
  const map = L.map('map').setView([48.4, 37.5], 6);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '© OpenStreetMap'
  }).addTo(map);

  // Панель інструментів
  map.pm.addControls({
    position: 'topleft',
    drawMarker: false,
    drawCircleMarker: false,
    drawPolyline: false,
    drawRectangle: false,
    drawCircle: false,
    drawText: false,
    drawPolygon: true,
    editMode: true,
    dragMode: true,
    removalMode: true,
    cutPolygon: false
  });

  let occupiedLayer = null;

  // Актуальне посилання (станом на 4 жовтня 2026)
  const url = 'https://raw.githubusercontent.com/cyterat/deepstate-map-data/main/data/deepstatemap_data_20261004.geojson';

  fetch(url)
    .then(r => {
      if (!r.ok) throw new Error('Не вдалося завантажити файл');
      return r.json();
    })
    .then(data => {
      occupiedLayer = L.geoJSON(data, {
        style: {
          color: '#c0392b',
          weight: 2,
          fillColor: '#e74c3c',
          fillOpacity: 0.45
        }
      }).addTo(map);

      // Робимо шар редагованим
      occupiedLayer.pm.enable({
        allowSelfIntersection: false
      });

      console.log('Карта завантажена успішно');
    })
    .catch(err => {
      console.error(err);
      alert('Помилка завантаження даних.\nПеревір консоль (F12).');
    });

  // Завантаження відредагованого GeoJSON
  function downloadGeoJSON() {
    if (!occupiedLayer) {
      alert('Шар ще не завантажився');
      return;
    }
    const geojson = occupiedLayer.toGeoJSON();
    const blob = new Blob([JSON.stringify(geojson, null, 2)], { type: 'application/json' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'ukraine_occupied_edited.geojson';
    link.click();
  }
</script>
</body>
</html>
