<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карта війни — просування</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f1115; color: #e5e7eb; overflow: hidden; }
    #map { height: 100vh; width: 100%; background: #0f1115; }
    #map.tool-draw, #map.tool-draw .leaflet-interactive { cursor: crosshair !important; touch-action: none; }

    .sidebar {
      position: absolute; top: 14px; left: 14px; width: 290px; max-height: calc(100vh - 28px);
      overflow-y: auto; background: rgba(17,20,28,0.95); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 16px;
      z-index: 1000; box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    .sidebar h2 { font-size: 15px; margin-bottom: 14px; font-weight: 600; }
    .section { margin-bottom: 16px; }
    .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: #9ca3af; margin-bottom: 7px; }

    button {
      display: block; width: 100%; padding: 9px 12px; margin-bottom: 6px; border: none; border-radius: 8px;
      font-size: 13px; cursor: pointer; color: white; text-align: left; transition: .15s;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
    }
    button:hover { background: rgba(255,255,255,0.12); }
    button.active { background: #2563eb; border-color: #2563eb; }
    button:disabled { opacity: .35; cursor: default; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .grid button { margin: 0; text-align: center; padding: 10px 6px; }
    .span2 { grid-column: span 2; }

    label.row { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; margin-bottom: 8px; gap: 8px; }
    label.row input[type=range] { flex: 1; }
    label.chk { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 6px; cursor: pointer; }
    .val { min-width: 52px; text-align: right; color: #9ca3af; font-variant-numeric: tabular-nums; }

    .stats { font-size: 12.5px; line-height: 1.8; }
    .stats b { font-variant-numeric: tabular-nums; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
    #status { font-size: 12px; color: #9ca3af; line-height: 1.45; margin-top: 4px; word-break: break-word; }
    .btn-green { background: #10b981; border-color: #10b981; }
    .btn-green:hover { background: #059669; }
    .btn-clear { background: rgba(239,68,68,.15); color: #f87171; border-color: rgba(239,68,68,.3); }

    .legend, .coords {
      position: absolute; z-index: 1000; background: rgba(17,20,28,0.9); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px; font-size: 12px; padding: 8px 12px;
    }
    .legend { right: 14px; bottom: 28px; line-height: 1.8; }
    .coords { left: 14px; bottom: 14px; color: #9ca3af; font-variant-numeric: tabular-nums; display: none; }
    @media (min-width: 700px) { .coords { display: block; left: 320px; } }

    .arrow-head { background: none; border: none; }
    .arrow-head div { width: 0; height: 0; border-left: 9px solid transparent; border-right: 9px solid transparent; border-bottom: 18px solid #f97316; }
  </style>
</head>
<body>

<div id="map"></div>

<div class="sidebar">
  <h2>🇺🇦 Карта війни</h2>

  <div class="section">
    <div class="section-title">Інструменти</div>
    <div class="grid">
      <button class="tool active" id="tool-pan" onclick="setTool('pan')">✋ Рука</button>
      <button class="tool" id="tool-lasso" onclick="setTool('lasso')">⭕ Обвести</button>
      <button class="tool" id="tool-brush" onclick="setTool('brush')">🖌 Пензель</button>
      <button class="tool" id="tool-arrow" onclick="setTool('arrow')">➤ Стрілка</button>
      <button class="tool span2" id="tool-erase" onclick="setTool('erase')">🧽 Гумка</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Параметри</div>
    <label class="row">Розмір пензля <input type="range" id="size" min="0.5" max="40" step="0.5" value="3"><span class="val" id="size-val">3 км</span></label>
    <label class="row">Сіра смуга <input type="range" id="band" min="0" max="5" step="0.1" value="0.5"><span class="val" id="band-val">500 м</span></label>
    <label class="row">Прозорість <input type="range" id="opacity" min="0.1" max="0.9" step="0.05" value="0.5"><span class="val" id="op-val">50%</span></label>
    <div class="grid">
      <button id="btn-undo" onclick="undo()">↶ Назад</button>
      <button id="btn-redo" onclick="redo()">↷ Вперед</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Підложка</div>
    <div class="grid">
      <button class="btn-layer active" id="btn-sat" onclick="setBase('sat')">Супутник</button>
      <button class="btn-layer" id="btn-streets" onclick="setBase('streets')">Вулиці</button>
      <button class="btn-layer span2" id="btn-dark" onclick="setBase('dark')">Темна</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Шари</div>
    <label class="chk"><input type="checkbox" id="chk-red" checked> Окупована зона</label>
    <label class="chk"><input type="checkbox" id="chk-band" checked> Сіра зона</label>
    <label class="chk"><input type="checkbox" id="chk-arrows" checked> Стрілки</label>
    <label class="chk"><input type="checkbox" id="chk-labels" checked> Підписи міст</label>
  </div>

  <div class="section">
    <div class="section-title">Статистика</div>
    <div class="stats">
      <div><span class="dot" style="background:#d9342b"></span>Площа зони: <b id="st-total">0</b> км²</div>
      <div>Зміна до DeepState: <b id="st-delta">0</b> км²</div>
      <div><span class="dot" style="background:#f97316"></span>Стрілок: <b id="st-arrows">0</b></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Файл</div>
    <button class="btn-green" onclick="downloadGeoJSON()">⬇ Завантажити GeoJSON</button>
    <button onclick="document.getElementById('file').click()">⬆ Відкрити GeoJSON</button>
    <input type="file" id="file" accept=".geojson,.json" style="display:none">
    <button onclick="resetToBase()">↺ Скинути до DeepState</button>
    <button class="btn-clear" onclick="clearAll()">Повністю очистити зону</button>
    <div id="status">Завантаження даних DeepState...</div>
  </div>
</div>

<div class="legend">
  <div><span class="dot" style="background:#d9342b"></span>Окуповано</div>
  <div><span class="dot" style="background:#d1d5db"></span>Сіра зона</div>
  <div><span class="dot" style="background:#f97316"></span>Напрям просування</div>
</div>
<div class="coords" id="coords">—</div>

<script>
  const $ = id => document.getElementById(id);
  const setStatus = html => $('status').innerHTML = html;
  window.addEventListener('error', e => setStatus('<span style="color:#f87171">Помилка: ' + e.message + '</span>'));
  window.addEventListener('unhandledrejection', e => setStatus('<span style="color:#f87171">Помилка: ' + (e.reason && e.reason.message || e.reason) + '</span>'));

  if (typeof L === 'undefined' || typeof turf === 'undefined') {
    setStatus('<span style="color:#f87171">Не завантажились бібліотеки Leaflet/Turf. Перевір інтернет.</span>');
  }

  // ===== Карта =====
  const map = L.map('map', { center: [47.5, 35.0], zoom: 8, zoomControl: false, doubleClickZoom: false });
  L.control.zoom({ position: 'topright' }).addTo(map);

  const panes = { band: 345, red: 370, arrows: 400, preview: 450, labels: 650 };
  for (const [n, z] of Object.entries(panes)) {
    map.createPane(n + 'Pane');
    map.getPane(n + 'Pane').style.zIndex = z;
    map.getPane(n + 'Pane').style.pointerEvents = 'none';
  }
  const redRenderer = L.canvas({ pane: 'redPane', padding: 0.3 });

  // ===== Підложки =====
  const layers = {
    sat: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18, attribution: 'Esri' }),
    streets: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: 'OSM' }),
    dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 18, attribution: 'Carto' })
  };
  const labels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 18, opacity: 0.9, pane: 'labelsPane'
  }).addTo(map);

  let currentBase = layers.sat.addTo(map);
  function setBase(type) {
    map.removeLayer(currentBase);
    currentBase = layers[type].addTo(map);
    currentBase.bringToBack();
    document.querySelectorAll('.btn-layer').forEach(b => b.classList.remove('active'));
    $('btn-' + type).classList.add('active');
  }

  const fmt = n => Math.round(n).toLocaleString('uk-UA');
  const fmtSigned = n => (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n));
  const fmtBand = km => km < 1 ? Math.round(km * 1000) + ' м' : (+km.toFixed(1)) + ' км';

  const RED = '#d9342b', BAND = '#d1d5db', ORANGE = '#f97316';

  // ===== Стан =====
  let state = { parts: [], arrows: [] };
  let baseParts = [], baseArea = 0;
  let brushKm = 3, bandKm = 0.5, fillOpacity = 0.5;
  let redLayer = null;
  const arrowsLayer = L.layerGroup().addTo(map);

  function kmToPx(km, lat) {
    const mpp = 156543.03392 * Math.cos(lat * Math.PI / 180) / Math.pow(2, map.getZoom());
    return km * 1000 / mpp;
  }

  // ===== Сіра зона: швидкий canvas-шар (обводка контуру мінус внутрішня частина) =====
  const BandLayer = L.Layer.extend({
    onAdd(m) {
      this._canvas = L.DomUtil.create('canvas');
      this._canvas.style.position = 'absolute';
      this._canvas.style.pointerEvents = 'none';
      this._canvas.style.opacity = 0.6;
      m.getPane('bandPane').appendChild(this._canvas);
      m.on('move', this.schedule, this);
      m.on('zoomend resize', this.redraw, this);
      m.on('zoomstart', () => { this._canvas.style.visibility = 'hidden'; });
      this.redraw();
    },
    onRemove(m) {
      L.DomUtil.remove(this._canvas);
      m.off('move', this.schedule, this);
      m.off('zoomend resize', this.redraw, this);
    },
    schedule() {
      if (this._raf) return;
      this._raf = requestAnimationFrame(() => { this._raf = null; this.redraw(); });
    },
    redraw() {
      if (!this._map) return;
      const m = this._map, size = m.getSize();
      const c = this._canvas;
      c.style.visibility = 'visible';
      c.width = size.x * 2; c.height = size.y * 2;
      L.DomUtil.setPosition(c, m.containerPointToLayerPoint([-size.x / 2, -size.y / 2]));
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, c.width, c.height);
      if (!bandKm || !state.parts.length) return;

      const ox = size.x / 2, oy = size.y / 2;
      const bandPx = 2 * kmToPx(bandKm, m.getCenter().lat);
      const view = m.getBounds().pad(0.6);
      const vb = [view.getWest(), view.getSouth(), view.getEast(), view.getNorth()];

      ctx.beginPath();
      let any = false;
      for (const p of state.parts) {
        if (!bboxOverlap(p.bb, vb)) continue;
        for (const ring of p.f.geometry.coordinates) {
          let lx = null, ly = null, first = true;
          for (let i = 0; i < ring.length; i++) {
            const pt = m.latLngToContainerPoint([ring[i][1], ring[i][0]]);
            const x = pt.x + ox, y = pt.y + oy;
            if (!first && Math.abs(x - lx) < 1 && Math.abs(y - ly) < 1 && i < ring.length - 1) continue;
            if (first) { ctx.moveTo(x, y); first = false; } else ctx.lineTo(x, y);
            lx = x; ly = y;
          }
          ctx.closePath();
          any = true;
        }
      }
      if (!any) return;
      ctx.lineJoin = 'round';
      ctx.lineWidth = bandPx;
      ctx.strokeStyle = BAND;
      ctx.stroke();
      ctx.globalCompositeOperation = 'destination-out';
      ctx.fillStyle = '#000';
      ctx.fill('evenodd');
      ctx.globalCompositeOperation = 'source-over';
    }
  });
  const bandLayer = new BandLayer().addTo(map);

  // ===== Робота з частинами =====
  function toPolys(f) {
    if (!f) return [];
    if (f.geometry.type === 'Polygon') return [f];
    if (f.geometry.type === 'MultiPolygon') return f.geometry.coordinates.map(c => turf.polygon(c));
    return [];
  }
  function makePart(f) {
    return { f, bb: turf.bbox(f), area: turf.area(f) / 1e6 };
  }
  function bboxOverlap(a, b) {
    return !(a[2] < b[0] || b[2] < a[0] || a[3] < b[1] || b[3] < a[1]);
  }
  function intersects(a, b) {
    try { return turf.booleanIntersects(a, b); } catch (e) { return true; }
  }

  function renderRed() {
    if (redLayer) map.removeLayer(redLayer);
    redLayer = L.geoJSON(turf.featureCollection(state.parts.map(p => p.f)), {
      renderer: redRenderer, interactive: false,
      style: { color: RED, weight: 1.5, fillColor: RED, fillOpacity }
    });
    if ($('chk-red').checked) redLayer.addTo(map);
    const total = state.parts.reduce((s, p) => s + p.area, 0);
    $('st-total').textContent = fmt(total);
    $('st-delta').textContent = fmtSigned(total - baseArea);
    $('st-arrows').textContent = state.arrows.length;
  }

  function renderArrows() {
    arrowsLayer.clearLayers();
    state.arrows.forEach(coords => {
      const pts = coords.map(c => L.latLng(c[1], c[0]));
      L.polyline(pts, { pane: 'arrowsPane', color: ORANGE, weight: 4, opacity: 0.95, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(arrowsLayer);
      const last = pts[pts.length - 1];
      let prev = pts[pts.length - 2];
      const pl = map.latLngToLayerPoint(last);
      for (let i = pts.length - 2; i >= 0; i--) {
        if (map.latLngToLayerPoint(pts[i]).distanceTo(pl) > 8) { prev = pts[i]; break; }
      }
      const pp = map.latLngToLayerPoint(prev);
      const angle = Math.atan2(pl.y - pp.y, pl.x - pp.x) * 180 / Math.PI + 90;
      L.marker(last, {
        pane: 'arrowsPane', interactive: false, keyboard: false,
        icon: L.divIcon({ className: 'arrow-head', iconSize: [18, 18], iconAnchor: [9, 9],
          html: '<div style="transform:rotate(' + angle + 'deg)"></div>' })
      }).addTo(arrowsLayer);
    });
    $('st-arrows').textContent = state.arrows.length;
  }

  function renderAll() {
    renderRed();
    renderArrows();
    bandLayer.redraw();
  }
  map.on('zoomend', renderArrows);

  // ===== Історія =====
  let hist = [], hi = -1;
  function snapshot() { return { parts: state.parts, arrows: state.arrows.map(a => a.slice()) }; }
  function pushHistory() {
    hist = hist.slice(0, hi + 1);
    hist.push(snapshot());
    if (hist.length > 30) hist.shift();
    hi = hist.length - 1;
    updateHistButtons();
  }
  function restore(i) {
    const s = hist[i];
    state = { parts: s.parts, arrows: s.arrows.map(a => a.slice()) };
    renderAll();
    updateHistButtons();
  }
  function undo() { if (hi > 0 && !busy) { hi--; restore(hi); } }
  function redo() { if (hi < hist.length - 1 && !busy) { hi++; restore(hi); } }
  function updateHistButtons() { $('btn-undo').disabled = hi <= 0; $('btn-redo').disabled = hi >= hist.length - 1; }

  // ===== Геометрія пензлів =====
  function union(a, b) {
    try { return turf.union(a, b) || a; } catch (e) { console.warn(e); return a; }
  }
  function diff(a, b) {
    try { return turf.difference(a, b); } catch (e) { console.warn(e); return a; }
  }
  function dedupe(latlngs) {
    const coords = [];
    latlngs.forEach(p => {
      const c = [p.lng, p.lat], l = coords[coords.length - 1];
      if (!l || l[0] !== c[0] || l[1] !== c[1]) coords.push(c);
    });
    return coords;
  }
  function brushShape(latlngs) {
    const coords = dedupe(latlngs);
    if (coords.length === 1) return turf.buffer(turf.point(coords[0]), brushKm, { units: 'kilometers', steps: 24 });
    let line = turf.lineString(coords);
    try { line = turf.simplify(line, { tolerance: brushKm / 111 / 8, highQuality: false }); } catch (e) {}
    return turf.buffer(line, brushKm, { units: 'kilometers', steps: 16 });
  }
  function lassoShape(latlngs) {
    const coords = dedupe(latlngs);
    if (coords.length < 3) return null;
    coords.push(coords[0]);
    let poly;
    try {
      poly = turf.polygon([coords]);
      try { poly = turf.simplify(poly, { tolerance: 0.0003 / Math.pow(2, Math.max(0, map.getZoom() - 9)), highQuality: false }); } catch (e) {}
    } catch (e) { console.warn(e); return null; }
    // виправляємо самоперетини
    try {
      const pieces = turf.unkinkPolygon(poly).features;
      if (pieces.length > 1) {
        let acc = pieces[0];
        for (let i = 1; i < pieces.length; i++) acc = union(acc, pieces[i]);
        return acc;
      }
    } catch (e) { console.warn(e); }
    return poly;
  }

  function addShape(shape) {
    const sb = turf.bbox(shape);
    const keep = [];
    let merged = shape;
    state.parts.forEach(p => {
      if (bboxOverlap(p.bb, sb) && intersects(p.f, shape)) merged = union(merged, p.f);
      else keep.push(p);
    });
    let changed = true;
    while (changed) {
      changed = false;
      const mb = turf.bbox(merged);
      for (let i = keep.length - 1; i >= 0; i--) {
        if (bboxOverlap(keep[i].bb, mb) && intersects(keep[i].f, merged)) {
          merged = union(merged, keep[i].f);
          keep.splice(i, 1);
          changed = true;
        }
      }
    }
    state.parts = keep.concat(toPolys(merged).map(makePart));
  }

  function cutShape(shape) {
    const sb = turf.bbox(shape);
    const out = [];
    state.parts.forEach(p => {
      if (bboxOverlap(p.bb, sb) && intersects(p.f, shape)) {
        toPolys(diff(p.f, shape)).forEach(f => out.push(makePart(f)));
      } else out.push(p);
    });
    state.parts = out;
  }

  let busy = false;
  function commitStroke(latlngs, t) {
    if (busy) return;
    busy = true;
    setStatus('Обчислення…');
    setTimeout(() => {
      try { doCommit(latlngs, t); setStatus('Готово'); }
      catch (e) { console.error(e); setStatus('<span style="color:#f87171">Помилка обчислення: ' + e.message + '</span>'); }
      busy = false;
    }, 20);
  }

  function doCommit(latlngs, t) {
    if (t === 'arrow') {
      const coords = [];
      latlngs.forEach(p => {
        const c = [p.lng, p.lat], l = coords[coords.length - 1];
        if (!l || map.latLngToLayerPoint(L.latLng(l[1], l[0])).distanceTo(map.latLngToLayerPoint(p)) > 4) coords.push(c);
      });
      if (coords.length < 2) return;
      let line = turf.lineString(coords);
      try { line = turf.simplify(line, { tolerance: 0.004 / Math.pow(2, map.getZoom() - 7), highQuality: true }); } catch (e) {}
      state.arrows = state.arrows.concat([line.geometry.coordinates]);
    } else if (t === 'lasso') {
      const shape = lassoShape(latlngs);
      if (!shape) return;
      addShape(shape);
    } else if (t === 'brush') {
      addShape(brushShape(latlngs));
    } else if (t === 'erase') {
      const shape = brushShape(latlngs);
      cutShape(shape);
      state.arrows = state.arrows.filter(a => {
        try { return !turf.booleanIntersects(turf.lineString(a), shape); } catch (e) { return true; }
      });
    }
    renderAll();
    pushHistory();
  }

  // ===== Інструменти =====
  let tool = 'pan';
  const toolInfo = {
    pan:   'Пересувай карту мишкою.',
    lasso: '<span style="color:#f87171">Обведення:</span> затисни ліву кнопку й обведи область. Контур замкнеться й приєднається до основної зони.',
    brush: '<span style="color:#f87171">Пензель:</span> затисни кнопку й малюй — зона розширюється.',
    arrow: '<span style="color:#fb923c">Стрілка:</span> затисни кнопку й проведи лінію.',
    erase: 'Гумка: затисни кнопку й стирай шматки зони та стрілки.'
  };

  function setTool(t) {
    cancelStroke();
    tool = t;
    document.querySelectorAll('.tool').forEach(b => b.classList.remove('active'));
    $('tool-' + t).classList.add('active');
    const draw = t !== 'pan';
    $('map').classList.toggle('tool-draw', draw);
    if (draw) map.dragging.disable(); else map.dragging.enable();
    if (!draw && cursorCircle) { map.removeLayer(cursorCircle); cursorCircle = null; }
    setStatus(toolInfo[t]);
  }

  // ===== Малювання затиснутою мишкою =====
  const cont = map.getContainer();
  let stroking = false, strokePts = [], previewLine = null, closeLine = null, previewFill = null, bandPrev = null, cursorCircle = null, activePointer = null;

  const pxWidth = lat => Math.max(2, 2 * kmToPx(brushKm, lat));
  const toolColor = () => ({ lasso: '#ffffff', brush: RED, arrow: ORANGE, erase: '#ffffff' }[tool]);

  cont.addEventListener('pointerdown', e => {
    if (tool === 'pan' || e.button !== 0 || !e.isPrimary || busy) return;
    if (e.target.closest('.leaflet-control')) return;
    e.preventDefault();
    stroking = true;
    activePointer = e.pointerId;
    try { cont.setPointerCapture(e.pointerId); } catch (_) {}
    const ll = map.mouseEventToLatLng(e);
    strokePts = [ll];
    const bpx = 2 * kmToPx(bandKm, ll.lat);

    if (tool === 'lasso') {
      if (bandKm > 0) bandPrev = L.polygon(strokePts, { pane: 'bandPane', interactive: false, color: BAND, weight: bpx, opacity: 0.6, fill: false, lineJoin: 'round' }).addTo(map);
      previewFill = L.polygon(strokePts, { pane: 'previewPane', interactive: false, stroke: false, fillColor: RED, fillOpacity: 0.25 }).addTo(map);
      previewLine = L.polyline(strokePts, { pane: 'previewPane', interactive: false, color: '#fff', weight: 2.5, dashArray: '8 7', lineCap: 'butt' }).addTo(map);
      closeLine = L.polyline([ll, ll], { pane: 'previewPane', interactive: false, color: '#fff', weight: 1.5, dashArray: '3 8', opacity: 0.7 }).addTo(map);
    } else {
      const isBrush = tool !== 'arrow';
      if (tool === 'brush' && bandKm > 0) {
        bandPrev = L.polyline(strokePts, { pane: 'bandPane', interactive: false, color: BAND, opacity: 0.6,
          weight: pxWidth(ll.lat) + bpx, lineCap: 'round', lineJoin: 'round' }).addTo(map);
      }
      previewLine = L.polyline(strokePts, {
        pane: 'previewPane', interactive: false, lineCap: 'round', lineJoin: 'round',
        color: toolColor(),
        weight: isBrush ? pxWidth(ll.lat) : 4,
        opacity: isBrush ? (tool === 'erase' ? 0.35 : fillOpacity) : 0.95
      }).addTo(map);
    }
  });

  cont.addEventListener('pointermove', e => {
    const ll = map.mouseEventToLatLng(e);
    $('coords').textContent = ll.lat.toFixed(4) + '°, ' + ll.lng.toFixed(4) + '°';

    if (tool === 'brush' || tool === 'erase') {
      if (!cursorCircle) {
        cursorCircle = L.circle(ll, { pane: 'previewPane', interactive: false, radius: brushKm * 1000,
          color: toolColor(), weight: 1.5, fill: false, dashArray: '4 4' }).addTo(map);
      } else {
        cursorCircle.setLatLng(ll).setRadius(brushKm * 1000).setStyle({ color: toolColor() });
      }
    } else if (cursorCircle) { map.removeLayer(cursorCircle); cursorCircle = null; }

    if (!stroking || e.pointerId !== activePointer) return;
    const last = strokePts[strokePts.length - 1];
    if (map.latLngToContainerPoint(last).distanceTo(map.latLngToContainerPoint(ll)) < 2) return;
    strokePts.push(ll);
    previewLine.setLatLngs(strokePts);
    if (bandPrev) bandPrev.setLatLngs(strokePts);
    if (tool === 'lasso') {
      previewFill.setLatLngs(strokePts);
      closeLine.setLatLngs([ll, strokePts[0]]);
    }
  });

  function endStroke(e) {
    if (!stroking || e.pointerId !== activePointer) return;
    const pts = strokePts.slice();
    const t = tool;
    cancelStroke();
    if (pts.length) commitStroke(pts, t);
  }
  cont.addEventListener('pointerup', endStroke);
  cont.addEventListener('pointercancel', () => cancelStroke());
  cont.addEventListener('pointerleave', () => { if (cursorCircle) { map.removeLayer(cursorCircle); cursorCircle = null; } });

  function cancelStroke() {
    stroking = false; activePointer = null; strokePts = [];
    [previewLine, closeLine, previewFill, bandPrev].forEach(l => { if (l) map.removeLayer(l); });
    previewLine = closeLine = previewFill = bandPrev = null;
  }

  // ===== Налаштування =====
  $('size').addEventListener('input', e => setSize(+e.target.value));
  function setSize(v) {
    brushKm = Math.min(40, Math.max(0.5, v));
    $('size').value = brushKm;
    $('size-val').textContent = brushKm + ' км';
  }
  $('band').addEventListener('input', e => {
    bandKm = +e.target.value;
    $('band-val').textContent = fmtBand(bandKm);
    bandLayer.redraw();
  });
  $('opacity').addEventListener('input', e => {
    fillOpacity = +e.target.value;
    $('op-val').textContent = Math.round(fillOpacity * 100) + '%';
    if (redLayer) redLayer.setStyle({ fillOpacity });
  });

  $('chk-labels').addEventListener('change', e => e.target.checked ? labels.addTo(map) : map.removeLayer(labels));
  $('chk-arrows').addEventListener('change', e => e.target.checked ? arrowsLayer.addTo(map) : map.removeLayer(arrowsLayer));
  $('chk-red').addEventListener('change', e => { if (redLayer) e.target.checked ? redLayer.addTo(map) : map.removeLayer(redLayer); });
  $('chk-band').addEventListener('change', e => e.target.checked ? bandLayer.addTo(map) : map.removeLayer(bandLayer));

  // ===== Гарячі клавіші =====
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' && e.target.type !== 'range' && e.target.type !== 'checkbox') return;
    const k = e.key.toLowerCase();
    if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if ((e.ctrlKey || e.metaKey) && k === 'y') { e.preventDefault(); redo(); return; }
    if (e.key === 'Escape') { cancelStroke(); return; }
    if (k === 'h') setTool('pan');
    else if (e.key === '1') setTool('lasso');
    else if (e.key === '2') setTool('brush');
    else if (e.key === '3') setTool('arrow');
    else if (e.key === '4') setTool('erase');
    else if (e.key === '[') setSize(brushKm - (brushKm > 5 ? 2.5 : 0.5));
    else if (e.key === ']') setSize(brushKm + (brushKm >= 5 ? 2.5 : 0.5));
  });

  // ===== DeepState → основні полігони =====
  function isNotOccupied(f) {
    const p = f.properties || {};
    const name = String(p.name || p.Name || '').toLowerCase();
    if (/сіра|серая|grey|gray|звільн|освобожд|liberat|деокуп/.test(name)) return true;
    const fill = p.fill;
    if (typeof fill === 'string' && /^#[0-9a-f]{6}$/i.test(fill)) {
      const r = parseInt(fill.slice(1, 3), 16), g = parseInt(fill.slice(3, 5), 16), b = parseInt(fill.slice(5, 7), 16);
      if (Math.max(r, g, b) - Math.min(r, g, b) < 24) return true;
    }
    return false;
  }

  function dateStr(d) {
    return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
  }

  async function loadDeepState() {
    // пробуємо сьогодні та 7 попередніх днів
    for (let back = 0; back < 8; back++) {
      const d = new Date(); d.setDate(d.getDate() - back);
      const ds = dateStr(d);
      const url = 'https://raw.githubusercontent.com/cyterat/deepstate-map-data/main/data/deepstatemap_data_' + ds + '.geojson';
      setStatus('Завантаження DeepState (' + ds + ')…');
      try {
        const r = await fetch(url);
        if (!r.ok) continue;
        const data = await r.json();
        return { data, ds };
      } catch (e) { /* пробуємо далі */ }
    }
    throw new Error('Не вдалося завантажити файл DeepState ні за одну з останніх 8 днів');
  }

  loadDeepState().then(({ data, ds }) => {
    const parts = [];
    let skipped = 0;
    (data.features || []).forEach(f => {
      if (!f.geometry || !/Polygon/.test(f.geometry.type) || isNotOccupied(f)) { skipped++; return; }
      toPolys(f).forEach(poly => {
        let g = poly;
        try { g = turf.simplify(poly, { tolerance: 0.0004, highQuality: false }); } catch (e) {}
        try { parts.push(makePart(turf.polygon(g.geometry.coordinates.map(r => r.map(c => [c[0], c[1]]))))); } catch (e) {}
      });
    });
    baseParts = parts;
    baseArea = parts.reduce((s, p) => s + p.area, 0);
    state = { parts: baseParts.slice(), arrows: [] };
    hist = []; hi = -1;
    pushHistory();
    renderAll();
    setStatus('Дані DeepState завантажено<br><small>' + ds.slice(6) + '.' + ds.slice(4, 6) + '.' + ds.slice(0, 4) + ' · полігонів: ' + parts.length + '</small>');
  }).catch(err => {
    console.error(err);
    setStatus('<span style="color:#f87171">Помилка завантаження DeepState</span><br>' + err.message + '<br><small>Можна малювати з нуля або відкрити свій GeoJSON.</small>');
    pushHistory();
  });

  // ===== Файли =====
  function downloadGeoJSON() {
    const features = state.parts.map(p => ({ ...p.f, properties: { type: 'occupied' } }));
    state.arrows.forEach(a => features.push(turf.lineString(a, { type: 'arrow' })));
    const blob = new Blob([JSON.stringify({ type: 'FeatureCollection', features })], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'ukraine_advances.geojson';
    a.click();
  }

  $('file').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const gj = JSON.parse(reader.result);
        const next = { parts: [], arrows: [] };
        (gj.features || []).forEach(ft => {
          const t = ft.properties && ft.properties.type;
          if (t === 'arrow') next.arrows.push(ft.geometry.coordinates);
          else if (t === 'occupied') toPolys(ft).forEach(p => next.parts.push(makePart(turf.polygon(p.geometry.coordinates))));
        });
        state = next; renderAll(); pushHistory();
        setStatus('Файл завантажено');
      } catch (err) {
        setStatus('<span style="color:#f87171">Не вдалося прочитати файл</span>');
      }
      e.target.value = '';
    };
    reader.readAsText(f);
  });

  function resetToBase() {
    if (!confirm('Скинути все до стану DeepState?')) return;
    state = { parts: baseParts.slice(), arrows: [] };
    renderAll(); pushHistory();
  }

  function clearAll() {
    if (!confirm('Повністю прибрати зону й стрілки?')) return;
    state = { parts: [], arrows: [] };
    renderAll(); pushHistory();
  }

  updateHistButtons();
</script>
</body>
</html>
