<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карта війни — просування</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f1115;
      color: #e5e7eb;
      overflow: hidden;
    }
    #map { height: 100vh; width: 100%; background: #0f1115; }
    #map.drawing, #map.drawing .leaflet-interactive { cursor: crosshair !important; }

    .sidebar {
      position: absolute; top: 14px; left: 14px; width: 270px;
      background: rgba(17, 20, 28, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px; padding: 16px; z-index: 1000;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    .sidebar h2 { font-size: 15px; margin-bottom: 14px; font-weight: 600; }
    .section { margin-bottom: 16px; }
    .section-title {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px;
      color: #9ca3af; margin-bottom: 7px;
    }
    button {
      display: block; width: 100%; padding: 9px 12px; margin-bottom: 6px;
      border: none; border-radius: 8px; font-size: 13px; cursor: pointer;
      color: white; text-align: left; transition: 0.15s;
    }
    .btn-layer { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); }
    .btn-layer:hover { background: rgba(255,255,255,0.12); }
    .btn-layer.active { background: #2563eb; border-color: #2563eb; }
    .btn-draw { background: #dc2626; }
    .btn-draw:hover { background: #b91c1c; }
    .btn-arrow { background: #ea580c; }
    .btn-arrow:hover { background: #c2410c; }
    button.on { outline: 2px solid #fff; }
    .btn-clear {
      background: rgba(239,68,68,0.15); color: #f87171;
      border: 1px solid rgba(239,68,68,0.3);
    }
    .btn-download { background: #10b981; }
    #status { font-size: 12px; color: #9ca3af; line-height: 1.45; margin-top: 8px; }

    .arrow-head { background: none; border: none; }
    .arrow-head div {
      width: 0; height: 0;
      border-left: 9px solid transparent;
      border-right: 9px solid transparent;
      border-bottom: 18px solid #f97316;
      transform-origin: 50% 50%;
    }
  </style>
</head>
<body>

<div id="map"></div>

<div class="sidebar">
  <h2>🇺🇦 Карта війни</h2>

  <div class="section">
    <div class="section-title">Підложка</div>
    <button class="btn-layer active" id="btn-sat" onclick="setBase('sat')">Супутник</button>
    <button class="btn-layer" id="btn-streets" onclick="setBase('streets')">Вулиці</button>
    <button class="btn-layer" id="btn-dark" onclick="setBase('dark')">Темна</button>
  </div>

  <div class="section">
    <div class="section-title">Малювання просування</div>
    <button class="btn-arrow" id="btn-arrow" onclick="startDraw('arrow')">➤ Малювати стрілку</button>
    <button class="btn-draw" id="btn-zone" onclick="startDraw('zone')">▮ Малювати зону</button>
    <button class="btn-clear" onclick="clearDrawings()">Очистити малюнки</button>
    <button class="btn-download" onclick="downloadGeoJSON()">Завантажити GeoJSON</button>
  </div>

  <div id="status">Завантаження даних DeepState...</div>
</div>

<script>
  // ===== Карта =====
  const map = L.map('map', { center: [48.45, 37.6], zoom: 7, zoomControl: false });
  L.control.zoom({ position: 'topright' }).addTo(map);

  // ===== Підложки =====
  const layers = {
    sat: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18, attribution: 'Esri' }),
    streets: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: 'OSM' }),
    dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 18, attribution: 'Carto' })
  };

  map.createPane('labelsPane');
  map.getPane('labelsPane').style.zIndex = 650;
  map.getPane('labelsPane').style.pointerEvents = 'none';

  const labels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 18, opacity: 0.9, pane: 'labelsPane'
  }).addTo(map);

  let currentBase = layers.sat;
  currentBase.addTo(map);

  function setBase(type) {
    map.removeLayer(currentBase);
    currentBase = layers[type];
    currentBase.addTo(map);
    currentBase.bringToBack();
    document.querySelectorAll('.btn-layer').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + type).classList.add('active');
  }

  // ===== Стилі =====
  const arrowStyle = { color: '#f97316', weight: 4, opacity: 0.95 };
  const zoneStyle  = { color: '#ef4444', weight: 2, fillColor: '#ef4444', fillOpacity: 0.35 };

  // ===== Намальовані елементи (тільки видалення, без перетягування) =====
  const drawings = L.featureGroup().addTo(map);
  const items = []; // { type, group, line }

  const statusEl = document.getElementById('status');
  const setStatus = (html) => statusEl.innerHTML = html;

  // ===== Стан малювання =====
  let mode = null;        // 'arrow' | 'zone' | null
  let points = [];
  let preview = null;     // тимчасова фігура
  let rubber = null;      // лінія до курсора

  function startDraw(type) {
    cancelDraw();
    mode = type;
    points = [];
    map.doubleClickZoom.disable();
    document.getElementById('map').classList.add('drawing');
    document.getElementById(type === 'arrow' ? 'btn-arrow' : 'btn-zone').classList.add('on');

    setStatus(type === 'arrow'
      ? '<span style="color:#fb923c">Стрілка:</span> клікай по карті, подвійний клік — завершити.<br><small>Backspace — скасувати точку, Esc — відміна</small>'
      : '<span style="color:#f87171">Зона:</span> клікай по карті, подвійний клік — завершити.<br><small>Backspace — скасувати точку, Esc — відміна</small>');
  }

  function cancelDraw() {
    if (preview) { map.removeLayer(preview); preview = null; }
    if (rubber) { map.removeLayer(rubber); rubber = null; }
    points = [];
    mode = null;
    map.doubleClickZoom.enable();
    document.getElementById('map').classList.remove('drawing');
    document.querySelectorAll('#btn-arrow, #btn-zone').forEach(b => b.classList.remove('on'));
  }

  function updatePreview() {
    if (preview) map.removeLayer(preview);
    if (points.length === 0) { preview = null; return; }
    preview = mode === 'zone' && points.length >= 3
      ? L.polygon(points, { ...zoneStyle, interactive: false })
