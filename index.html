<!DOCTYPE html>

    <title>m0rph map</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0d1117;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        h1 {
            font-size: 60px;
            margin: 0 0 15px;
            color: #58a6ff;
        }

        p {
            color: #8b949e;
            font-size: 20px;
        }

        button {
            margin-top: 20px;
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            background: #238636;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #2ea043;
        }

        <h1>m0rph map</h1>
        <p>Добро пожаловать на мой сайт 👋</p>
